# 重点色
AccentColorField=

[Metadata]
# 名称
Name=mint-green-light
# 版本
Version=0.0.1
# 作者
Author=witt
# 描述
Description=碧皓青

[InputPanel]
# 一般文字颜色
NormalColor=#323232
# 高亮文字颜色
HighlightColor=#ed9564
# 高亮背景颜色
HighlightBackgroundColor=#68a97c
# 高亮候选词颜色
HighlightCandidateColor=#FFFFFF
# KWin 下启用模糊
EnableBlur=True
# 模糊遮罩
BlurMask=
# 竖排列表时使用所有横向空间高亮
FullWidthHighlight=True
# 页面按钮垂直对齐
PageButtonAlignment=Bottom

[InputPanel/BlurMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/Background]
Image=panel.svg
Color=#ffffff
BorderColor=#ffffff
BorderWidth=0
Overlay=
Gravity="Top Left"
OverlayOffsetX=0
OverlayOffsetY=0
HideOverlayIfOversize=False

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Background/OverlayClipMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/Highlight]
